name: CI


on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint, type-check and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name : Set up node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build shared package for type resolution
        run: npm run build -w @beacon/shared

      - name: Type-check shared package
        run: npx tsc --noEmit -p packages/shared/tsconfig.json

      - name: Type-check API
        run: npx tsc --noEmit -p apps/api/tsconfig.json

      - name: Type-check worker
        run: npx tsc --noEmit -p apps/worker/tsconfig.json

      - name: Build api
        run: npm run build -w @beacon/api

      - name: Build worker and shared package
        run: npm run build -w apps/worker


  test:
    name: Database migration and worker tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DATABASE_URL: postgres://postgres:ci-only@localhost:5432/beacon_ci

    services:
      postgres:
        image: postgres:16.14-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: beacon_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d beacon_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
    - name: Check out repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 24
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Apply database migrations
      run: npm run migrate --workspace=@beacon/api

    - name: Run existing tests
      run: npm test









