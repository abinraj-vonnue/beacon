map "$request_method:$uri" $beacon_write_rate_key{
  default "";
  ~^(POST:/monitors|PATCH:/monitors/[^/]+|DELETE:/monitors/[^/]+|POST:/api/monitors|PATCH:/api/monitors/[^/]+|DELETE:/api/monitors/[^/]+)$ $binary_remote_addr;

}

limit_req_zone $beacon_write_rate_key zone=beacon_writes:10m rate=5r/s;
