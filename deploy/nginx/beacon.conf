
server {
    listen 80;
    server_name beacon.test;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name beacon.test;

    ssl_certificate /etc/nginx/tls/beacon.test.pem;
    ssl_certificate_key /etc/nginx/tls/beacon.test-key.pem;

    access_log /var/log/nginx/beacon-access.log;
    error_log /var/log/nginx/beacon-error.log;

    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types application/json text/plain text/css application/javascript;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 5s;

    }
}
