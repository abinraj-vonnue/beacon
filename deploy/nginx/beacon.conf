
server {
    listen 80;
    server_name beacon.test;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name beacon.test;

    ssl_certificate /etc/nginx/tls/beacon.test.pem;
    ssl_certificate_key /etc/nginx/tls/beacon.test-key.pem;

    access_log /var/log/nginx/beacon-access.log;
    error_log /var/log/nginx/beacon-error.log;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
