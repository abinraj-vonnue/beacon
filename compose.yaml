services:
  db:
    image: postgres:16.14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-beacon}
      POSTGRES_USER: ${POSTGRES_USER:-beacon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend
    init: true
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    mem_limit: 512m
    cpus: 1.0

  migrate:
    image: beacon-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "apps/api/dist/migrate.js"]
    restart: "no"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-beacon}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-beacon}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    init: true
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 256m
    cpus: 0.5

  api:
    image: beacon-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-beacon}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-beacon}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - backend
    init: true
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 512m
    cpus: 1.0


  worker:
    image: beacon-worker:local
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-beacon}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-beacon}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - backend
    init: true
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 256m
    cpus: 0.5

  target:
    image: mccutchen/go-httpbin:v2.15.0
    command: ["/bin/go-httpbin","-host", "0.0.0.0"]
    networks:
      - backend
    init: true
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 128m
    cpus: 0.5

volumes:
  postgres_data:

networks:
  backend:
